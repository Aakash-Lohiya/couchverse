# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service runs the API, Socket.IO and serves the built client.
services:
  - type: web
    name: couchverse
    runtime: node
    plan: free            # free: sleeps when idle and has no persistent disk (SQLite resets on deploy)
    buildCommand: npm ci && npm --prefix client ci && npm run build && npm run fetch-samples
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: SITE_ORIGIN
        value: https://couchverse.onrender.com   # change to your actual Render URL after the first deploy
      - key: ALLOW_DEV_LOGIN
        value: "false"                           # Google Sign-In is configured; flip to "true" to allow email dev accounts
      - key: GOOGLE_CLIENT_ID
        value: 679370494465-u5p86elg791g98al2kl63ol983kua936.apps.googleusercontent.com   # public OAuth web client id (Firebase project)
      - key: EXTENSION_STORE_URL
        sync: false
      # Persistent accounts/friends/preferences on the free plan: create a free
      # database at https://turso.tech and set both values in the dashboard.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
    # For persistent data on a paid plan, add a disk and set DB_PATH=/var/data/couchverse.sqlite:
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
